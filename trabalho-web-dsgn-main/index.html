<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja Simples - Controle de Produtos</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <header id="batata-cabecalho">
      <div class="header-brand">
        <div class="header-icon">
          <i class="fa-solid fa-bag-shopping"></i>
        </div>
        <div class="header-texto">
          <h1>Simple Store</h1>
        </div>
      </div>
    </header>

    <main>
      <section class="cartao" id="batata-form-card">
        <h2>Novo produto</h2>
        <form id="form-produto" novalidate>
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Caderno" required />

          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="Ex: 12.50" required />

          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" name="quantidade" min="1" placeholder="Ex: 10" required />

          <p id="mensagem-erro" class="mensagem-erro" aria-live="polite"></p>

          <button id="botao-submit" type="submit">Adicionar produto</button>
        </form>
      </section>

      <section class="cartao" id="batata-lista-card">
        <h2>Produtos cadastrados</h2>
        <p id="batata-vazia" class="lista-vazia" hidden>Nenhum produto cadastrado.</p>
        <ul id="lista-produtos"></ul>
        <p id="batata-contador" class="contador-produtos">Produtos cadastrados: 0</p>
      </section>
    </main>

    <footer>
      <p>Eduardo Cesar Gonçalves 2026</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
